version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # Local file: dependency, vendored under frontend/ckeditor5 — not on a registry.
      - dependency-name: "@ti-gecko/tiloc-ckeditor5"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
