[tool.black]
line-length = 120
target-version = ['py312', 'py313']
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
node_modules
| .DS_Store
| .idea
| __pycache__
| .pytest_cache
| backup
| backups
| files
| frontend
| log
| static
| staticfiles
| tmp
)
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.poetry]
package-mode = false
name = "tiloc"
version = "0.1.0"
description = ""
authors = ["Cédric RICARD <ricard33@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
arrow = "^1.2.3"
babel = "^2.10.3"
django = ">=5.2,<6.2"
django-constance = "^4.3"
# Maintenance fork of the unmaintained Tivix/django-cron, made Django 5.1+ compatible
# (index_together -> Meta.indexes). Do not swap for the PyPI release. Branch: django-5.
django-cron = { git = "https://github.com/ricard33/django-cron", branch = "django-5" }
django-dbbackup = "^5.3"
django-filter = ">=25.1,<27.0"
django-import-export = "^4.3.7"
django-proxy = "^1.2.1"
django-rest-knox = "^5.1.0"
django-simple-history = "^3.13"
djangorestframework = "^3.14.0"
gunicorn = ">=22.0,<27.0"
# Git fork for lenient parsing of the malformed iCal feeds some booking channels emit
# (core/sync.py). Do not swap for the PyPI release. Branch: more-permissive-parsing.
ics = { git = "https://github.com/ricard33/ics-py", branch="more-permissive-parsing" }
invoke = "^2.1.3"
jinja2 = "^3.1.2"
JSON-log-formatter = "^0.5.1"
loggly-python-handler = "^1.0.1"
newrelic = ">=10.11,<14"
pdfkit = "^1.0.0"
Pillow = ">=10.4,<14.0"
requests = "^2.28.1"
smartconfigparser = "^1.0.0"
whitenoise = { version = "^6.2.0", extras = ["brotli"] }
psycopg2-binary = "^2.9.7"
faker = "^37.0"
django-email-verification = "^0.3.3"
# Pinned to v7: code uses stripe.Invoice.upcoming and stripe.error.SignatureVerificationError,
# both removed/relocated in stripe v8+.
stripe = "^7.5.0"
django-timezone-field = "^7.0"
django-anymail = {extras = ["mailjet", "brevo"], version = ">=14.0,<16.0"}
django-user-visit = "^2.3"
django-loginas = "^0.3.11"
django-request-logging = "^0.7.5"
openpyxl = "^3.1.5"
watchdog = ">=4.0,<7.0"  # used by location/logging_config.py (was transitive via my-django-tweaks)

[tool.poetry.group.dev.dependencies]
coverage = "^7.3.2"
django-stubs = ">=5.2,<7.0"
djangorestframework-stubs = "^3.16.7"
fabric = "^3.0"
factory_boy = "^3.3.1"
flake8 = "^7.1"
isort = "^5.6.4"
patchwork = {git = "https://github.com/ricard33/patchwork.git", rev = "fabric3"}
pytest = ">=7.4.3,<10.0.0"
pytest-django = "^4.7.0"
black = ">=23.11,<27.0"
pytest-cov = "^6.0"
setuptools = ">=70.0,<84.0"
pyyaml = "^6.0.2"

[tool.coverage.run]
source = ["core", "location", "notifier"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "location/wsgi.py",
    "location/asgi.py",
    "location/logging_config.py",  # infra, vendored verbatim from my-django-tweaks
]

[tool.coverage.report]
# Locks in the current level; raise this as coverage improves, never lower it.
fail_under = 77
skip_covered = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
